<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atme</title>
    <meta
      name="description"
      content="A macOS menu bar app that keeps you from missing Slack messages meant for you."
    />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --bg: #ffffff;
        --link: #0066cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --bg: #1d1d1f;
          --link: #4da3ff;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          17px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Hiragino Sans",
          sans-serif;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1rem;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 1rem;
      }
      p {
        margin: 0 0 1rem;
      }
      .ja {
        color: var(--muted);
      }
      a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>atme</h1>
      <p>
        A macOS menu bar app that keeps you from missing Slack messages meant
        for you. It shows mentions of you and DMs in a menu bar list and as
        notifications.
      </p>
      <p class="ja" lang="ja">
        自分宛の Slack を見落とさないための、macOS
        のメニューバーアプリです。自分へのメンションと DM
        を、メニューバーの一覧と通知で知らせます。
      </p>
      <p>
        <a href="https://github.com/dominion525/atme"
          >github.com/dominion525/atme</a
        >
      </p>
    </main>
  </body>
</html>
